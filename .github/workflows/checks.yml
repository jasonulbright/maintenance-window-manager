name: Checks

# Lint, tests and coverage floor (Invoke-Checks.ps1) on Windows PowerShell 5.1 and PowerShell 7.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SUITE_ALLOW_WINDOW_TESTS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Pester and PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run the checks
        shell: powershell
        run: .\Invoke-Checks.ps1

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SUITE_ALLOW_WINDOW_TESTS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run the checks
        shell: pwsh
        run: .\Invoke-Checks.ps1
